version: v2

deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
  - buf.build/bufbuild/protovalidate

lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX

# FILE is the strictest level. The draft (ai_grid/draft) is the console's proposal,
# not this service's API, so it may change freely; see docs/API_CONTRACT.md.
breaking:
  use:
    - FILE
  ignore:
    - ai_grid/draft
