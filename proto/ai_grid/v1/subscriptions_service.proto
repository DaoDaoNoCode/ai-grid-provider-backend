syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/subscription_type.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

message SubscriptionsListRequest {
  // Index of the first result. If not specified the default value will be zero.
  optional int32 offset = 1;

  // Maximum number of results to be returned by the server. When not specified all
  // the results will be returned.
  optional int32 limit = 2;

  // Filter criteria (CEL). Empty means no filter. Not evaluated yet.
  optional string filter = 3;

  // Order criteria. Empty means undefined order. Not evaluated yet.
  optional string order = 4;
}

message SubscriptionsListResponse {
  // Actual number of items returned.
  int32 size = 1;

  // Total number of items that match the search criteria.
  int32 total = 2;

  // List of results.
  repeated Subscription items = 3;
}

message SubscriptionsGetRequest {
  // Subscription id (equals metadata.name).
  string id = 1;
}

message SubscriptionsGetResponse {
  Subscription object = 1;
}

message SubscriptionsCreateRequest {
  Subscription object = 1;
}

message SubscriptionsCreateResponse {
  Subscription object = 1;
}

message SubscriptionsUpdateRequest {
  Subscription object = 1;
  google.protobuf.FieldMask update_mask = 2;

  // Lock enables optimistic locking against metadata.version. Not enforced yet.
  bool lock = 3;
}

message SubscriptionsUpdateResponse {
  Subscription object = 1;
}

message SubscriptionsDeleteRequest {
  // Subscription id (equals metadata.name).
  string id = 1;
}

message SubscriptionsDeleteResponse {}

// Subscriptions manage MaaS entitlements (spoke MaaSSubscription CRs).
// Storage and spoke reconciliation are not implemented yet; List returns empty
// and Get/Create/Update/Delete return Unimplemented.
service Subscriptions {
  rpc List(SubscriptionsListRequest) returns (SubscriptionsListResponse) {
    option (google.api.http) = {get: "/api/v1/subscriptions"};
  }

  rpc Get(SubscriptionsGetRequest) returns (SubscriptionsGetResponse) {
    option (google.api.http) = {
      get: "/api/v1/subscriptions/{id}"
      response_body: "object"
    };
  }

  rpc Create(SubscriptionsCreateRequest) returns (SubscriptionsCreateResponse) {
    option (google.api.http) = {
      post: "/api/v1/subscriptions"
      body: "object"
      response_body: "object"
    };
  }

  rpc Update(SubscriptionsUpdateRequest) returns (SubscriptionsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/v1/subscriptions/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  rpc Delete(SubscriptionsDeleteRequest) returns (SubscriptionsDeleteResponse) {
    option (google.api.http) = {delete: "/api/v1/subscriptions/{id}"};
  }
}
