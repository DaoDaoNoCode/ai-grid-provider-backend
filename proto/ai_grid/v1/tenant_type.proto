syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/metadata_type.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

// A tenant groups resources and users.
// Backed by a Keycloak Organization in the shared platform realm (KEYCLOAK_REALM),
// not by a Keycloak realm per tenant.
message Tenant {
  // Unique identifier of the tenant (Keycloak organization id / UUID).
  string id = 1;

  // metadata.name is the organization name. metadata.version is kept in the
  // organization attribute ai-grid/resource-version: 1 on Create, bumped on
  // every Update this backend makes, and 1 for an organization without the
  // attribute (created in Keycloak directly). metadata.creation_timestamp comes from
  // the attribute ai-grid/create-time (RFC 3339), stamped on Create; it's
  // unset for an organization created elsewhere. Both are output only.
  Metadata metadata = 2;
  TenantSpec spec = 3;
  TenantStatus status = 4;
}

message TenantSpec {
  // Email domains associated with this tenant (DNS hostnames, lowercase).
  // Create and an update of the domains need at least one: Keycloak finds a
  // user's organization, and so its identity provider, by their email domain.
  repeated string domains = 1;

  // Optional OIDC identity provider for this organization; unset means the
  // organization has none, so its members can't sign in yet. Create sets it;
  // Update adds it or changes it in place (the organization, its id and its
  // members stay), and repeating the stored value writes nothing. Removing it
  // returns InvalidArgument. config.issuer changes in place only while nobody
  // has signed in through the identity provider, else FailedPrecondition:
  // Keycloak links a member by the provider alias and the subject the provider
  // sends, not by issuer, so a user of a new issuer with a matching subject
  // would sign in as that member. A wrong issuer lets nobody sign in, so it can
  // still be corrected. An issuer change is judged against the issuer
  // Keycloak's identity provider has, which can differ from the stored one
  // after an unconfirmed write or an edit made in Keycloak. An add finding an
  // identity provider under the
  // organization's alias that this API didn't create is FailedPrecondition
  // too, and changes nothing. Whenever the issuer is set (Create, an
  // added identity provider, a changed issuer), Keycloak must read its
  // discovery document (else FailedPrecondition), which must name
  // config.issuer (else InvalidArgument). On every write Keycloak is asked to
  // load the signing keys from config.jwks_url when set: a reload that fails
  // is FailedPrecondition, but one Keycloak skips (for example within 10
  // seconds of the last) keeps the write, and the keys load at the next
  // sign-in. A refused write changes nothing. The API stores only the Secret name in
  // config.client_secret_secret_name, never the secret value; the Secret is
  // read on every write of the identity provider: a missing Secret is
  // NotFound, one without a non-empty client-secret key FailedPrecondition.
  IdentityProvider identity_provider = 2;
}

message TenantStatus {}

// An organization's OIDC identity provider (realm IdP linked to the Keycloak
// Organization). Field numbers match the draft proposal.
message IdentityProvider {
  // Display title. At most 253 characters after trimming. Empty on Create
  // normalizes to the organization create-time name.
  string title = 1;
  // Free text. At most 4000 characters.
  string description = 2;
  // Unset means true. Always set on output. Must be true when set.
  optional bool enabled = 3;
  // Required OIDC client configuration.
  OidcConfig config = 4;
}

// OIDC client configuration for an IdentityProvider. Only the name of the
// Secret that holds the client secret is stored, never the secret itself.
message OidcConfig {
  // Required; at most 253 characters after trimming.
  string client_id = 1;
  // Name of the Secret holding the client secret (key client-secret): required,
  // a DNS subdomain name, at most 253 characters.
  string client_secret_secret_name = 2;
  // Required HTTP or HTTPS URLs, at most 2048 characters after trimming.
  string issuer = 3;
  string authorization_url = 4;
  string token_url = 5;
  // Space-separated scopes, at most 2048 characters after trimming.
  // Empty/unset normalizes to "openid profile email".
  string default_scopes = 6;
  // Optional HTTP or HTTPS URLs; empty when unset.
  string user_info_url = 7;
  // HTTP or HTTPS URL. Required when validate_signature is true (the default):
  // Keycloak rejects broker logins when signature checks are on and it has no JWKS.
  // Empty only when validate_signature is false.
  string jwks_url = 8;
  // Optional HTTP or HTTPS URL; empty when unset.
  string logout_url = 9;
  // Unset means true. Always set on output. When true, jwks_url is required.
  optional bool validate_signature = 10;
}

// TenantMember is a Keycloak user that belongs to the tenant's Organization.
// This is a read projection for listing; full user management is out of scope.
message TenantMember {
  // Keycloak user id (UUID).
  string id = 1;

  // Local Keycloak login username.
  string username = 2;

  // Email address when present on the user.
  string email = 3;

  string first_name = 4;
  string last_name = 5;

  // Whether the Keycloak user is enabled.
  bool enabled = 6;

  // Optional profile label from the upstream identity provider. It can repeat
  // across members or be empty. Do not use it as a member identity.
  string preferred_username = 7;
}
