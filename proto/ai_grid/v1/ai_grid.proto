syntax = "proto3";

package ai_grid.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "AI Grid API"
    version: "0.1.0"
    description: "gRPC-Gateway REST surface for ai-grid-provider-backend (Ping, ManagedClusters, Tenants)."
    contact: {
      name: "AI Grid"
      url: "https://github.com/osac-project/ai-grid-provider-backend"
    }
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
};

// A minimal health API for this standalone service.
service AiGrid {
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {
      get: "/api/ai-grid/v1/ping"
    };
  }
}

// A sample cluster-management API. The response shape is intentionally based
// on Kubernetes ManagedCluster metadata so the backing store can later be
// replaced with the ACM/OCM Kubernetes API.
service ManagedClusters {
  rpc ListManagedClusters(ListManagedClustersRequest) returns (ListManagedClustersResponse) {
    option (google.api.http) = {
      get: "/api/ai-grid/v1/managed_clusters"
    };
  }
}

// Tenants are represented by Keycloak Organizations in the shared ai-grid realm.
service Tenants {
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = {
      get: "/api/ai-grid/v1/tenants"
    };
  }
}

message PingRequest {
  string name = 1;
}

message PingResponse {
  string message = 1;
}

message ListManagedClustersRequest {}

message ListManagedClustersResponse {
  repeated ManagedCluster clusters = 1;
}

message ManagedCluster {
  string name = 1;
  map<string, string> labels = 2;
  bool hub_accepts_client = 3;
}

message ListTenantsRequest {}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

message Tenant {
  string id = 1;
  string name = 2;
  repeated string domains = 3;
}
