syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/condition_type.proto";
import "ai_grid/v1/metadata_type.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

// Subscription is a MaaS entitlement that binds identity subjects to models
// with token rate limits and a priority.
//
// It maps to the spoke-cluster Kubernetes CR MaaSSubscription
// (apiVersion: maas.opendatahub.io/v1alpha1). It is not an OLM Subscription,
// not an AAP license subscription, and not OSAC SERVICE_TIER_MAAS
// ("Metal as a Service").
//
// The `spec` contains the desired details and may be modified by the user.
// The `status` contains the current status and is provided by the system.
message Subscription {
  // Unique identifier of the subscription. Equals metadata.name.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  Metadata metadata = 2;
  SubscriptionSpec spec = 3;
  SubscriptionStatus status = 4;
}

// Desired state of a MaaS Subscription.
message SubscriptionSpec {
  // Identity subjects entitled by this subscription.
  SubscriptionOwner owner = 1;

  // Models this subscription applies to, with optional per-model rate limits.
  repeated SubscriptionModelRef model_refs = 2;

  // Relative priority among subscriptions (higher wins when policies conflict).
  int32 priority = 3;

  // Stable organization association. May be set once; then immutable.
  SubscriptionOrganization organization = 4;

  // Metadata for token attribution and metering.
  TokenMetadata token_metadata = 5;

  // Scheduling priority for inference under this subscription. Distinct from
  // priority. When unset, no InferenceObjective is created.
  optional int32 inference_priority = 6;

  // Guardrail policies attached to every model accessed through this subscription.
  repeated GuardrailAttachment guardrails = 7;
}

// SubscriptionOrganization identifies the organization that administers a subscription.
message SubscriptionOrganization {
  // Organization identifier. Non-empty; immutable once set.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
  }];
}

// SubscriptionOwner names the groups and users that own the entitlement.
message SubscriptionOwner {
  // IdP / Kubernetes group names.
  repeated string groups = 1;

  // User names (for example service accounts).
  repeated string users = 2;
}

// SubscriptionModelRef references a model and optional token rate limits.
message SubscriptionModelRef {
  // Model name (DNS-1123 label).
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  // Model namespace. Empty means the platform default model namespace.
  string namespace = 2;

  // Token rate limits for this model. Required unless unlimited is true.
  // Must be empty when unlimited is true.
  repeated TokenRateLimit token_rate_limits = 3;

  // Access without a token budget. Mutually exclusive with token_rate_limits.
  bool unlimited = 4;

  // Cost per token, when set.
  BillingRate billing_rate = 5;

  // Guardrails for this model within the subscription.
  repeated GuardrailAttachment guardrails = 6;

  // Output enrichment from MaaSModelRef annotations. Ignored on write.
  string display_name = 7;

  // Output enrichment from MaaSModelRef annotations. Ignored on write.
  string description = 8;
}

// TokenRateLimit caps token usage over a time window.
message TokenRateLimit {
  // Maximum tokens allowed in the window. CRD range is typically 1..1e9.
  int64 limit = 1;

  // Window duration, e.g. "1m", "30s", "2h". Pattern: ^[1-9]\d{0,3}(s|m|h)$.
  string window = 2;
}

// BillingRate defines cost per token.
message BillingRate {
  string per_token = 1;
}

// TokenMetadata contains metadata for token attribution and metering.
message TokenMetadata {
  // Legacy organization id for metering when organization.id is unset.
  string organization_id = 1;
  string cost_center = 2;
  map<string, string> labels = 3;
}

// GuardrailAttachment attaches an AIGuardrail policy by name.
message GuardrailAttachment {
  // Name of the AIGuardrail in the tenant namespace.
  string ref_name = 1;
  // Selected check names; empty means all checks in the policy.
  repeated string checks = 2;
}

// Observed state of a MaaS Subscription.
message SubscriptionStatus {
  // Controller-reported phase (for example "Active"). Empty until reconciled.
  string phase = 1;

  // Controller conditions (Ready, SpecPriorityDuplicate, ...).
  repeated Condition conditions = 2;

  // Per referenced model reconciliation status.
  repeated ResourceRefStatus model_ref_statuses = 3;

  // Per generated TokenRateLimitPolicy status.
  repeated TokenRateLimitStatus token_rate_limit_statuses = 4;
}

// ResourceRefStatus is the state of one object a MaaS resource references or generates.
message ResourceRefStatus {
  string name = 1;
  string namespace = 2;
  bool ready = 3;
  string reason = 4;
  string message = 5;
}

// TokenRateLimitStatus reports a generated TokenRateLimitPolicy and its model.
message TokenRateLimitStatus {
  ResourceRefStatus ref = 1;
  string model = 2;
}

// AuthPolicy is a MaaSAuthPolicy: groups/users allowed to call a set of models.
message AuthPolicy {
  // Resource name (equals metadata.name on the CR).
  string id = 1;

  Metadata metadata = 2;

  // Groups entitled by this policy.
  repeated string subject_groups = 3;

  // Users entitled by this policy.
  repeated string subject_users = 4;

  // Models this policy grants.
  repeated AuthPolicyModelRef model_refs = 5;

  // Controller phase (for example "Active").
  string phase = 6;

  // Controller conditions.
  repeated Condition conditions = 7;
}

// AuthPolicyModelRef references a MaaSModelRef granted by an AuthPolicy.
message AuthPolicyModelRef {
  string name = 1;
  string namespace = 2;
}

// ModelRegistration is a MaaSModelRef's catalog status for a referenced model.
message ModelRegistration {
  string name = 1;
  string namespace = 2;
  // Pending, Ready, Unhealthy, Failed, or Invalid.
  string phase = 3;
  // Endpoint when Ready; empty otherwise.
  string endpoint = 4;
  repeated Condition conditions = 5;
}
