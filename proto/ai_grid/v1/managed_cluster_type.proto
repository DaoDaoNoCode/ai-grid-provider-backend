syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/metadata_type.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

// Hub-side ACM/OCM ManagedCluster inventory object.
//
// The `spec` contains the desired details and may be modified by the user.
// The `status` contains the current status and is provided by the system.
message ManagedCluster {
  // Unique identifier of the managed cluster. For hub CRs this equals metadata.name.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  Metadata metadata = 2;
  ManagedClusterSpec spec = 3;
  ManagedClusterStatus status = 4;
}

// Desired state of a hub ManagedCluster.
message ManagedClusterSpec {
  // Whether the hub accepts the spoke cluster client.
  bool hub_accepts_client = 1;
}

// Observed state of a hub ManagedCluster.
message ManagedClusterStatus {
  // True when the ManagedCluster Available condition is True.
  bool available = 1;

  // True when the ManagedCluster Joined condition is True.
  bool joined = 2;

  // Raw Available condition status ("True", "False", "Unknown", …). Empty when absent.
  // The backend derives `state` from it and the other conditions; read
  // `state` for Ready, Offline or Unknown.
  string available_condition = 3;

  // AI Grid provisioning, from the cluster's compliance with the hub's
  // ai-grid-ready Policy (by default ai-grid-policies/ai-grid-ready):
  // "Compliant" (provisioned), "NonCompliant", or "Pending" (placed, no
  // result yet). Empty when the Policy doesn't cover the cluster, for
  // example because it isn't labelled ai-grid/enabled=true, or when the
  // Policy can't be read.
  string provisioning = 4;

  // `status.conditions`, as the hub reports them, in the hub's order.
  repeated ManagedClusterCondition conditions = 5;

  // `status.version.kubernetes`, for example "v1.34.9". Empty until the
  // cluster's agent reports it.
  string kubernetes_version = 6;

  // `status.capacity`: what the cluster's nodes provide, as Kubernetes
  // quantity strings keyed by resource name (for example "cpu": "68",
  // "memory": "273509824Ki", "nvidia.com/gpu": "1"). Empty until the agent
  // reports it.
  map<string, string> capacity = 7;

  // `status.allocatable`, keyed and encoded like `capacity`.
  map<string, string> allocatable = 8;

  // `status.clusterClaims`, as the cluster's agent reports them, for example
  // `consoleurl.cluster.open-cluster-management.io`,
  // `platform.open-cluster-management.io` and
  // `product.open-cluster-management.io`.
  repeated ManagedClusterClaim cluster_claims = 9;
  // The cluster's GPUs, from ACM Search's index of its nodes and the labels
  // NVIDIA GPU Feature Discovery puts on them. Unset when Search isn't
  // available or hasn't indexed the cluster; `capacity["nvidia.com/gpu"]`
  // still counts its schedulable GPUs then.
  ClusterGPUs gpus = 10;

  // True when the cluster is an AI Grid member: its `ai-grid/enabled` label
  // is exactly "true", the label selector the hub's AI Grid Placements
  // match. A cluster joins or leaves the grid through Update, by setting or
  // removing that label in `metadata.labels`.
  bool ai_grid_member = 11;

  // The cluster's lifecycle state, derived from its conditions and its
  // deletion timestamp in the order the ACM console uses. UNSPECIFIED until
  // the hub reports any condition.
  ManagedClusterState state = 12;

  // The message of the condition that decided `state`, for example "Managed
  // cluster is available" or "Try to import managed cluster, error: ...".
  // Empty when that condition has no message or is absent.
  string state_message = 13;

  // Where the cluster is, for a map. Always set.
  ManagedClusterLocation location = 14;
}

// Lifecycle state of a ManagedCluster, one per state the ACM console shows.
// Checked in this order, the first that applies wins:
//
//   metadata.deletion_timestamp set                    -> DETACHING
//   no conditions at all                               -> UNSPECIFIED
//   HubAcceptedManagedCluster not True                 -> NOT_ACCEPTED
//   ManagedClusterJoined not True, and
//     ManagedClusterImportSucceeded False with reason
//       ManagedClusterImporting                        -> IMPORTING
//       ManagedClusterImportFailed                     -> IMPORT_FAILED
//     otherwise                                        -> PENDING_IMPORT
//   ManagedClusterConditionAvailable True              -> READY
//   ManagedClusterConditionAvailable False             -> OFFLINE
//   otherwise (Unknown or absent)                      -> UNKNOWN
//
// "Not True" means False or absent. The ACM console's "needs approval" (a
// pending CSR) and its hosted-cluster states aren't derived: the backend
// reads neither CSRs nor HostedClusters, so such a cluster is PENDING_IMPORT.
enum ManagedClusterState {
  // The hub has reported no condition yet; a client also reads a state added
  // after it was built as UNSPECIFIED.
  MANAGED_CLUSTER_STATE_UNSPECIFIED = 0;
  // Joined and available. ACM console: `ready`.
  MANAGED_CLUSTER_STATE_READY = 1;
  // Joined; the agent reports the cluster unavailable (Available False, for
  // example the kube-apiserver is down). ACM console: `offline`.
  MANAGED_CLUSTER_STATE_OFFLINE = 2;
  // Joined; the hub has no current report (Available Unknown or absent,
  // usually an expired lease). ACM console: `unknown`.
  MANAGED_CLUSTER_STATE_UNKNOWN = 3;
  // Accepted, not joined, import not started or not reported. ACM console:
  // `pendingimport`.
  MANAGED_CLUSTER_STATE_PENDING_IMPORT = 4;
  // Accepted, not joined, the import controller is applying the klusterlet.
  // ACM console: `importing`.
  MANAGED_CLUSTER_STATE_IMPORTING = 5;
  // Accepted, not joined, the import failed. ACM console: `importfailed`.
  MANAGED_CLUSTER_STATE_IMPORT_FAILED = 6;
  // The hub hasn't accepted the cluster (HubAcceptedManagedCluster absent or
  // False, for example after hub_accepts_client was set to false). ACM
  // console: `notaccepted`.
  MANAGED_CLUSTER_STATE_NOT_ACCEPTED = 7;
  // The ManagedCluster is being deleted and its agent removed. ACM console:
  // `detaching`.
  MANAGED_CLUSTER_STATE_DETACHING = 8;
}

// Where a cluster is. A hub admin sets it once with the ManagedCluster
// annotations `ai-grid/latitude`, `ai-grid/longitude` (decimal degrees) and
// `ai-grid/site-name`; see the README, "Cluster locations".
//
// `latitude` and `longitude` are both set or both unset. Without either
// annotation, a cluster in a known cloud region gets approximate
// coordinates (source CLOUD_REGION). When the annotations are wrong, the
// coordinates are unset, `source` is NONE and `problem` says what to fix:
// the backend never falls back to the region past a mistake.
message ManagedClusterLocation {
  option (buf.validate.message).cel = {
    id: "managed_cluster_location.coordinates_paired"
    message: "latitude and longitude must be both set or both unset"
    expression: "has(this.latitude) == has(this.longitude)"
  };

  // `ai-grid/site-name`, surrounding whitespace removed. Kept whether or not
  // there are coordinates.
  string site_name = 1;

  // Decimal degrees, -90..90. Unset when there are no coordinates; 0 is a
  // valid latitude.
  optional double latitude = 2 [(buf.validate.field).double = {
    gte: -90
    lte: 90
    finite: true
  }];

  // Decimal degrees, -180..180. Unset when there are no coordinates; 0 is a
  // valid longitude.
  optional double longitude = 3 [(buf.validate.field).double = {
    gte: -180
    lte: 180
    finite: true
  }];

  // Where `latitude` and `longitude` come from.
  ManagedClusterLocationSource source = 4;

  // What is wrong with the coordinate annotations, for a hub admin to fix,
  // for example `ai-grid/latitude "40,7" is not a decimal number of
  // degrees, such as 40.7128 or -74.006`. Several problems are joined with
  // "; ". Empty when there is nothing to fix; missing annotations are not a
  // problem. Meant to be shown as is; match on it in no code.
  string problem = 5;

  // The cloud region the cluster runs in, from its
  // `region.open-cluster-management.io` claim (for example "us-east-2"), as
  // a fact whatever `source` is. Empty when the agent reports none, as on
  // most on-premises clusters.
  string region = 6;
}

// Where a cluster's coordinates come from.
enum ManagedClusterLocationSource {
  // Not reported; a client also reads a source added after it was built as
  // UNSPECIFIED.
  MANAGED_CLUSTER_LOCATION_SOURCE_UNSPECIFIED = 0;
  // No coordinates: no annotations and no known cloud region, or
  // annotations with a `problem`.
  MANAGED_CLUSTER_LOCATION_SOURCE_NONE = 1;
  // The `ai-grid/latitude` and `ai-grid/longitude` annotations, as the hub
  // admin set them.
  MANAGED_CLUSTER_LOCATION_SOURCE_ANNOTATIONS = 2;
  // Approximate: the city or area the cloud provider names for `region`,
  // used when neither annotation is set. Good for a pin on a world map, not
  // for the data center's position; a UI should say it is approximate.
  MANAGED_CLUSTER_LOCATION_SOURCE_CLOUD_REGION = 3;
}

// GPU inventory of one cluster.
message ClusterGPUs {
  // GPU devices on the cluster's GPU nodes, as GPU Feature Discovery counts
  // them: the sum of each node's `count`. That is physical GPUs, except on a
  // node with MIG strategy "single", where GFD's count is the MIG devices
  // (GFD replaces the physical count there and reports none; under "mixed"
  // it stays the physical count).
  int32 total = 1;
  // Nodes with at least one GPU.
  int32 node_count = 2;
  // The distinct node configurations (vendor, product, memory, GPUs per node,
  // sharing), each with how many nodes have it, most nodes first, then by
  // product. One entry is the usual case, for example NVIDIA-L4 with 1 GPU per
  // node on 2 nodes.
  repeated GPUConfiguration configurations = 3;
  // Every GPU node, by name.
  repeated GPUNode nodes = 4;
}

// Nodes that share one GPU configuration.
message GPUConfiguration {
  // "NVIDIA" for the nvidia.com labels.
  string vendor = 1;
  // `nvidia.com/gpu.product` as GPU Feature Discovery writes it, for example
  // "NVIDIA-L4" or "NVIDIA-H200"; MIG and time-slicing suffixes kept.
  string product = 2;
  // `nvidia.com/gpu.memory`, MiB per GPU (per MIG device under MIG
  // strategy "single").
  int64 memory_mib = 3;
  // `nvidia.com/gpu.count`: physical GPUs, or MIG devices under MIG
  // strategy "single" (see ClusterGPUs.total).
  int32 gpus_per_node = 4;
  // Nodes with this configuration.
  int32 node_count = 5;
  // How these nodes share or slice their GPUs.
  GPUSharing sharing = 6;
}

// How a node's GPUs are shared or sliced.
message GPUSharing {
  // `nvidia.com/gpu.sharing-strategy`: "none", "time-slicing" or "mps";
  // "mig" when `nvidia.com/mig.strategy` is set. Empty when GPU Feature
  // Discovery reports none.
  string strategy = 1;
  // `nvidia.com/gpu.replicas`: schedulable units per GPU; 1 without sharing.
  int32 replicas = 2;
  // `nvidia.com/mig.capable`.
  bool mig_capable = 3;
  // `nvidia.com/mig.strategy`: "single" or "mixed"; empty without MIG.
  string mig_strategy = 4;
}

// One node with GPUs.
message GPUNode {
  // The node's name.
  string name = 1;
  // "NVIDIA" for the nvidia.com labels.
  string vendor = 2;
  // `nvidia.com/gpu.product`, for example "NVIDIA-L4".
  string product = 3;
  // `nvidia.com/gpu.count`: physical GPUs, or MIG devices under MIG
  // strategy "single" (see ClusterGPUs.total).
  int32 count = 4;
  // `nvidia.com/gpu.memory`, MiB per GPU.
  int64 memory_mib = 5;
  // `nvidia.com/gpu.family`, the architecture, for example "ada-lovelace".
  string family = 6;
  // `nvidia.com/gpu.compute.major` "." `minor`, for example "8.9".
  string compute_capability = 7;
  // `nvidia.com/cuda.driver-version.full`, for example "580.105.08".
  string driver_version = 8;
  // `nvidia.com/cuda.runtime-version.full`, for example "13.0".
  string cuda_runtime_version = 9;
  // How the node shares or slices its GPUs.
  GPUSharing sharing = 10;
  // `nvidia.com/gpu.machine`, the instance type, for example "g6.xlarge".
  string instance_type = 11;
  // The node's Ready condition is True.
  bool ready = 12;
}

// One `status.conditions[]` entry of a ManagedCluster.
message ManagedClusterCondition {
  // For example "ManagedClusterConditionAvailable" or "ManagedClusterJoined".
  string type = 1;

  // "True", "False" or "Unknown".
  string status = 2;

  string reason = 3;

  string message = 4;

  // Unset when the hub recorded none.
  google.protobuf.Timestamp last_transition_time = 5;
}

// One `status.clusterClaims[]` entry of a ManagedCluster.
message ManagedClusterClaim {
  string name = 1;

  string value = 2;
}
