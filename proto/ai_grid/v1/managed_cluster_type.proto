syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/metadata_type.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

// Hub-side ACM/OCM ManagedCluster inventory object.
//
// The `spec` contains the desired details and may be modified by the user.
// The `status` contains the current status and is provided by the system.
message ManagedCluster {
  // Unique identifier of the managed cluster. For hub CRs this equals metadata.name.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  Metadata metadata = 2;
  ManagedClusterSpec spec = 3;
  ManagedClusterStatus status = 4;
}

// Desired state of a hub ManagedCluster.
message ManagedClusterSpec {
  // Whether the hub accepts the spoke cluster client.
  bool hub_accepts_client = 1;
}

// Observed state of a hub ManagedCluster.
message ManagedClusterStatus {
  // True when the ManagedCluster Available condition is True.
  bool available = 1;

  // True when the ManagedCluster Joined condition is True.
  bool joined = 2;

  // Raw Available condition status ("True", "False", "Unknown", …). Empty when absent.
  // Used by the Clusters presentation layer to derive Ready/Offline/Unknown.
  string available_condition = 3;

  // AI Grid provisioning, from the cluster's compliance with the hub's
  // ai-grid-ready Policy (by default ai-grid-policies/ai-grid-ready):
  // "Compliant" (provisioned), "NonCompliant", or "Pending" (placed, no
  // result yet). Empty when the Policy doesn't cover the cluster, for
  // example because it isn't labelled ai-grid/enabled=true, or when the
  // Policy can't be read.
  string provisioning = 4;

  // `status.conditions`, as the hub reports them, in the hub's order.
  repeated ManagedClusterCondition conditions = 5;

  // `status.version.kubernetes`, for example "v1.34.9". Empty until the
  // cluster's agent reports it.
  string kubernetes_version = 6;

  // `status.capacity`: what the cluster's nodes provide, as Kubernetes
  // quantity strings keyed by resource name (for example "cpu": "68",
  // "memory": "273509824Ki", "nvidia.com/gpu": "1"). Empty until the agent
  // reports it.
  map<string, string> capacity = 7;

  // `status.allocatable`, keyed and encoded like `capacity`.
  map<string, string> allocatable = 8;

  // `status.clusterClaims`, as the cluster's agent reports them, for example
  // `consoleurl.cluster.open-cluster-management.io`,
  // `platform.open-cluster-management.io` and
  // `product.open-cluster-management.io`.
  repeated ManagedClusterClaim cluster_claims = 9;
}

// One `status.conditions[]` entry of a ManagedCluster.
message ManagedClusterCondition {
  // For example "ManagedClusterConditionAvailable" or "ManagedClusterJoined".
  string type = 1;

  // "True", "False" or "Unknown".
  string status = 2;

  string reason = 3;

  string message = 4;

  // Unset when the hub recorded none.
  google.protobuf.Timestamp last_transition_time = 5;
}

// One `status.clusterClaims[]` entry of a ManagedCluster.
message ManagedClusterClaim {
  string name = 1;

  string value = 2;
}
