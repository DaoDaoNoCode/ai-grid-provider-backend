syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/condition_type.proto";
import "ai_grid/v1/metadata_type.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

// Model is a deployable LLM inference workload on the AI Grid.
//
// It is committed to the backend's Git catalog: an LLMInferenceService
// (serving.kserve.io/v1alpha2) that Argo CD delivers to the clusters the
// placement names, and an ExternalModel and MaaSModelRef that publish it
// through the grid on the ingress clusters.
//
// The `spec` contains the desired details and may be modified by the user.
// The `status` contains the current status and is provided by the system.
message Model {
  // Unique identifier. Equals metadata.name (DNS-1123 label).
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  Metadata metadata = 2;
  ModelSpec spec = 3;
  ModelStatus status = 4;
}

// Desired state of a Model (trimmed LLMInferenceService.spec + ACM placement).
message ModelSpec {
  // Where the artifact comes from and the name clients send.
  ModelSource model = 1;

  // Static replica count. Mutually exclusive with scaling.
  optional int32 replicas = 2;

  // LLMInferenceServiceConfig preset names merged under the spec. Each is a
  // name with no whitespace; an empty or blank name is InvalidArgument.
  repeated string base_refs = 3 [(buf.validate.field).repeated.items = {
    string: {pattern: "^\\S+$"}
  }];

  // Optional ServingRuntime / ClusterServingRuntime name.
  string runtime = 4;

  // Router / gateway configuration.
  ModelRouter router = 5;

  // Main container of the workload template. Its image may be empty: the
  // presets' image applies, KServe's default one without base_refs (see
  // ModelContainer.image).
  ModelContainer main = 6;

  // Autoscaling. Mutually exclusive with replicas.
  ModelScaling scaling = 7;

  // Where to deploy. Required: names at least one cluster by the ACM `name`
  // label (`name In [...]` or a `name` match label); the model is listed in
  // each named cluster's index in the Git catalog. A cluster that a create or
  // update adds must be a ManagedCluster on the hub, or the call is
  // InvalidArgument naming it, with a google.rpc.ResourceInfo detail per
  // unknown cluster (resource_type
  // `type.googleapis.com/ai_grid.v1.ManagedCluster`, resource_name the
  // cluster); Models/ListPlacementClusters lists the clusters a model can run
  // on.
  ModelPlacement placement = 8;

  // Rollout. Only strategy All (the default) is accepted: Argo CD delivers to
  // every placed cluster at once.
  ModelRollout rollout = 9;
}

// Model artifact source (spec.model).
message ModelSource {
  // Artifact URI (hf://, oci://, s3://, pvc://, http(s)://).
  string uri = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];

  // Deprecated: a model is served as its id, the name tenants send in the
  // request model field. Output: always the name the model is served as,
  // which is the id, or for a model saved before that change, the name it
  // still serves until its next update switches it to the id. Input: must be
  // empty or the id (or, on update, the name a read returned); any other value
  // is InvalidArgument. For a human-readable name, use annotation
  // openshift.io/display-name.
  string name = 2 [deprecated = true];
}

// Router configuration (spec.router).
message ModelRouter {
  // Gateway refs. Empty uses the product default
  // (openshift-ingress/openshift-ai-inference).
  repeated ModelGatewayRef gateway_refs = 1;

  // When true, controller manages the HTTPRoute (spec.router.route: {}).
  bool managed_route = 2;

  // When true, inference scheduler is created (spec.router.scheduler: {}).
  bool scheduler = 3;
}

// One gateway reference.
message ModelGatewayRef {
  string name = 1;
  string namespace = 2;
  string section_name = 3;
}

// Main container resources and environment.
message ModelContainer {
  // Runtime image. Optional: empty, the image comes from the presets. KServe
  // applies its default preset first (the llm-template, vLLM for NVIDIA
  // GPUs), then the LLMInferenceServiceConfigs named in base_refs, then the
  // service's own spec, and an empty image in the service doesn't override
  // theirs (combineBaseRefsConfig and mergeSpecs in
  // pkg/controller/v1alpha2/llmisvc/config_merge.go,
  // red-hat-data-services/kserve rhoai-3.6 at 71b7da3). So with no base_refs
  // the cluster's default vLLM image for NVIDIA GPUs runs; an image set here
  // replaces any preset's. A blank image, or one with a space or tab, is
  // InvalidArgument.
  string image = 1;

  // Resource requests (cpu, memory, nvidia.com/gpu, ...): Kubernetes
  // quantities, which must parse and be non-negative. The values the
  // container can't have are InvalidArgument, as Kubernetes would refuse
  // them on every cluster: an extended resource such as nvidia.com/gpu that
  // isn't a whole number, a request above its limit, and, for the resources
  // Kubernetes can't overcommit (extended resources and hugepages-*), a
  // request that differs from its limit. Such a resource with a request and
  // no limit is saved with the request as its limit, as Kubernetes requires
  // the limit (validateResourceRequirements in kubernetes/kubernetes
  // pkg/apis/core/validation). An Update that replaces requests and not
  // limits drops each such limit that equalled its saved request, so the
  // limit follows the new request, and a removed request takes its limit
  // with it. A rule across the two maps is checked by the server only.
  map<string, string> requests = 2 [(buf.validate.field).map = {
    keys: {
      string: {min_len: 1}
    }
    values: {
      // A Kubernetes quantity (k8s.io/apimachinery resource.ParseQuantity)
      // without a minus sign.
      string: {pattern: "^\\+?[0-9.]+[eEinumkKMGTP]*[-+]?[0-9]*$"}
    }
  }];

  // Resource limits: Kubernetes quantities, as requests.
  map<string, string> limits = 3 [(buf.validate.field).map = {
    keys: {
      string: {min_len: 1}
    }
    values: {
      string: {pattern: "^\\+?[0-9.]+[eEinumkKMGTP]*[-+]?[0-9]*$"}
    }
  }];

  // Environment variables (for example VLLM_ADDITIONAL_ARGS).
  repeated ModelEnvVar env = 4;
}

// One environment variable.
message ModelEnvVar {
  string name = 1;
  string value = 2;
}

// KEDA-based autoscaling.
message ModelScaling {
  // Minimum replicas (default 1 when unset / zero).
  int32 min_replicas = 1;

  // Maximum replicas (required when scaling is set).
  int32 max_replicas = 2;

  // Whether KEDA scaling is enabled. Must be true when scaling is set.
  bool keda = 3;

  // KEDA scale triggers (at least one required when keda is true).
  repeated ModelKedaTrigger triggers = 4;
}

// One KEDA scale trigger.
message ModelKedaTrigger {
  string type = 1;
  map<string, string> metadata = 2;
}

// ACM Placement desired state (subset used by the Models API).
message ModelPlacement {
  // Cluster sets to draw from. Empty means every bound set.
  repeated string cluster_sets = 1;

  // Label selector over ManagedCluster labels.
  ModelLabelSelector label_selector = 2;

  // Cap on selected clusters. Unset means all matching.
  optional int32 number_of_clusters = 3;
}

// Label selector for Placement predicates.
message ModelLabelSelector {
  map<string, string> match_labels = 1;
  repeated ModelLabelSelectorRequirement match_expressions = 2;
}

// One label selector requirement.
message ModelLabelSelectorRequirement {
  string key = 1;
  // In, NotIn, Exists, or DoesNotExist.
  string operator = 2;
  repeated string values = 3;
}

// ManifestWorkReplicaSet rollout strategy.
message ModelRollout {
  ModelRolloutStrategy strategy = 1;
  // Progressive only: clusters at once (integer or percent like "20%").
  string max_concurrency = 2;
  // Failed/timed-out clusters tolerated (integer or percent).
  string max_failures = 3;
  // Progress deadline (e.g. "5m", "None").
  string progress_deadline = 4;
  // Hold succeeded slot before next (Progressive).
  string min_success_time = 5;
}

// Rollout strategy type.
enum ModelRolloutStrategy {
  MODEL_ROLLOUT_STRATEGY_UNSPECIFIED = 0;
  MODEL_ROLLOUT_STRATEGY_ALL = 1;
  MODEL_ROLLOUT_STRATEGY_PROGRESSIVE = 2;
  MODEL_ROLLOUT_STRATEGY_PROGRESSIVE_PER_GROUP = 3;
}

// Observed state of a Model.
message ModelStatus {
  // External URL when known.
  string url = 1;

  // LLMInferenceService conditions.
  repeated Condition conditions = 2;

  // Derived summary phase (see ModelPhase).
  ModelPhase phase = 3;

  // Reason of the condition that decided phase. In git mode: SavedToGit
  // while no cluster has reported, else Ready, PartiallyAvailable, Failed,
  // Stopped or NotReady with the phase (see ModelPhase).
  string reason = 4;

  // Message of the condition that decided phase. In git mode, while a
  // cluster has reported: where the model is ready, for example "Failed on
  // site-a; not ready on site-b; ready on site-c; no report from site-d;
  // published on hub", then Argo CD's message for each failed object. An
  // ingress-only cluster, where the model doesn't run, is named apart by
  // whether MaaS publishes the model there: "published on", "not published
  // on" or "failed to publish on".
  string message = 5;

  // Placement status when placement is set.
  ModelPlacementStatus placement = 6;

  // ManifestWorkReplicaSet status when placement is set. Git mode has no
  // ManifestWorkReplicaSet and never sets it; each placed cluster's status
  // is in `clusters`.
  ModelRolloutStatus rollout = 7;

  // Observed generation from the LLMInferenceService.
  int64 observed_generation = 8;

  // The model on each cluster its placement names (the clusters in
  // placement.selected_clusters), one entry per cluster in cluster-name
  // order, from what the hub's catalog Argo CD Applications report. Empty while no
  // cluster has reported (reason SavedToGit). Ingress clusters the model
  // isn't placed on, which publish it but don't run it, have no entry; their
  // reports count in `phase` and `message`. Output only.
  repeated ModelClusterStatus clusters = 9;

  // The model's deployment, summed over its placed clusters
  // (`clusters[].deployment` and `sync`): FAILED when one reports it failed
  // or its sync failed; STARTING when one is starting or hasn't reported;
  // STOPPED when every one is stopped; RUNNING when every one runs it or is
  // stopped, and at least one runs it; UNSPECIFIED while none has reported
  // a deployment. A placed cluster stopped on purpose doesn't make the model
  // STARTING. It says
  // nothing about MaaS: see `maas`. It can differ from `phase`: a model
  // failed on one cluster and running on another is FAILED here and
  // PARTIALLY_AVAILABLE there. Output only.
  ModelDeploymentState deployment = 10 [(buf.validate.field).enum.defined_only = true];

  // The model in MaaS, for a list's Availability column, summed over the
  // ingress clusters (`ingress`), worst first: FAILED;
  // AWAITING_SUBSCRIPTION_AND_BACKEND; CONFIGURING_ROUTING (also while one
  // hasn't reported); AWAITING_SUBSCRIPTION; AVAILABLE. AVAILABLE and
  // CONFIGURING_ROUTING become UNAVAILABLE when no placed cluster serves the
  // model (no `clusters[].deployment` is RUNNING). A failed sync doesn't
  // stop a previous revision that is still running. UNSPECIFIED while none has reported. Each
  // `ingress` entry keeps MaaS's own message. Output only.
  ModelMaasState maas = 11 [(buf.validate.field).enum.defined_only = true];

  // The model on each ingress cluster, one entry per cluster in cluster-name
  // order: the ones with a catalog ingress Application and the ones labelled
  // ai-grid/enabled "true" and ai-grid/role ingress or combined. A combined
  // cluster has an entry here and in `clusters`. Empty while no cluster has
  // reported (reason SavedToGit). Output only.
  repeated ModelIngressStatus ingress = 12;

  // The model's rollout in one word, Git sync and deployment together, for
  // a list's Status column (`clusters[].state` summed): SAVED_TO_GIT while no
  // cluster has reported; READY when every placed cluster is READY;
  // PARTIALLY_READY when some are and some aren't; else FAILED when one is
  // failed; STOPPED when all are stopped (or every reporting one is);
  // STARTING when one is starting; SYNCING when one hasn't applied Git's
  // change yet; SYNCED when every one has but none reports a deployment yet.
  // `phase` stays the MaaS-inclusive answer. Output only.
  ModelState state = 13 [(buf.validate.field).enum.defined_only = true];
}

// What one placed cluster reports about the model's LLMInferenceService.
enum ModelDeploymentState {
  // No report: the LLMInferenceService isn't on the cluster yet, or the
  // cluster doesn't list it. ModelClusterStatus.sync says whether Argo CD
  // has applied it.
  MODEL_DEPLOYMENT_STATE_UNSPECIFIED = 0;
  // On the cluster but not serving yet: progressing, or KServe reports a
  // step that is still under way, such as a Deployment below its minimum
  // availability. That step has no deadline: a pod that keeps crashing,
  // can't pull its image or finds no GPU leaves the same message, so it also
  // shows here, with KServe's message, until it is fixed.
  MODEL_DEPLOYMENT_STATE_STARTING = 1;
  // Ready=True: serving. While ModelClusterStatus.sync isn't SYNCED, this
  // is the previous revision.
  MODEL_DEPLOYMENT_STATE_RUNNING = 2;
  // KServe reports it not ready for another reason.
  MODEL_DEPLOYMENT_STATE_FAILED = 3;
  // KServe reports it stopped ("Service is stopped"): the
  // LLMInferenceService carries the serving.kserve.io/stop annotation, so
  // it runs no pods.
  MODEL_DEPLOYMENT_STATE_STOPPED = 4;
}

// A model's rollout, Git sync and deployment together (ModelStatus.state,
// ModelClusterStatus.state).
enum ModelState {
  // No report.
  MODEL_STATE_UNSPECIFIED = 0;
  // Committed to Git; no cluster has reported it yet.
  MODEL_STATE_SAVED_TO_GIT = 1;
  // Argo CD hasn't applied Git's change yet, or is retrying it: the model
  // isn't on the cluster yet, or it is stopped there and out of sync (a
  // start on its way). A running cluster out of sync stays READY: its
  // previous revision serves, and an edit in flight can't be told from
  // lasting drift, so a stop shows READY until Argo CD applies it.
  MODEL_STATE_SYNCING = 2;
  // Applied; KServe hasn't reported the deployment yet.
  MODEL_STATE_SYNCED = 3;
  // On the cluster, not serving yet (ModelDeploymentState STARTING).
  MODEL_STATE_STARTING = 4;
  // Serving.
  MODEL_STATE_READY = 5;
  // Serving on some placed clusters, not all. Model only.
  MODEL_STATE_PARTIALLY_READY = 6;
  // KServe reports it failed, or Argo CD couldn't sync it.
  MODEL_STATE_FAILED = 7;
  // Stopped (serving.kserve.io/stop). KServe reports no stopping step: one
  // reconcile marks the service stopped and deletes its workloads, so there
  // is no STOPPING.
  MODEL_STATE_STOPPED = 8;
}

// Whether Argo CD has applied what Git holds for the model on one cluster.
enum ModelSyncState {
  // No report: the cluster has no Application in the catalog's models
  // ApplicationSet, or the backend can't read the Applications.
  MODEL_SYNC_STATE_UNSPECIFIED = 0;
  // The live LLMInferenceService matches Git.
  MODEL_SYNC_STATE_SYNCED = 1;
  // Not applied yet: the cluster's Application doesn't list it yet, it is
  // OutOfSync or Missing, or Argo CD is retrying its sync (sync_message
  // says why).
  MODEL_SYNC_STATE_OUT_OF_SYNC = 2;
  // Argo CD's sync to the revision it wants failed and it stopped retrying
  // (sync_message says why).
  MODEL_SYNC_STATE_FAILED = 3;
}

// What one ingress cluster reports about the model's MaaSModelRef and
// ExternalModel.
enum ModelMaasState {
  // No report: the cluster doesn't list both of them yet.
  MODEL_MAAS_STATE_UNSPECIFIED = 0;
  // MaaS is still setting up the route: Argo CD hasn't synced them or they
  // are progressing, or the MaaSModelRef says "Governed but backend is not
  // ready", "Waiting for tenant resolution: ..." or "Waiting for HTTPRoute
  // to be created". For an ExternalModel, MaaS's "backend" is its HTTPRoute
  // accepted by the gateway, not the model's pods.
  MODEL_MAAS_STATE_CONFIGURING_ROUTING = 1;
  // Published and governed: MaaSModelRef Ready ("Governed and
  // runtime-healthy"), so tenants with a subscription can call it.
  MODEL_MAAS_STATE_AVAILABLE = 2;
  // Routed, but no active MaaSSubscription and MaaSAuthPolicy pair covers
  // it, so no tenant can call it yet ("Awaiting governance pairing").
  MODEL_MAAS_STATE_AWAITING_SUBSCRIPTION = 3;
  // MaaS or the AI gateway reports it failed, or Argo CD couldn't sync it.
  MODEL_MAAS_STATE_FAILED = 4;
  // No subscription covers it and its route isn't ready either ("Awaiting
  // governance pairing and backend readiness").
  MODEL_MAAS_STATE_AWAITING_SUBSCRIPTION_AND_BACKEND = 5;
  // No placed cluster serves it, while MaaS publishes it or is still
  // routing it: MaaS checks only the route, so it can't see the model's pods
  // are down. Summary only (ModelStatus.maas), from the placed clusters'
  // live deployment states.
  MODEL_MAAS_STATE_UNAVAILABLE = 6;
}

// Where a cluster's View link goes (ModelClusterStatus.view_url).
enum ModelViewTarget {
  // No link: no https console URL claim, and no annotation on an ingress or
  // combined cluster.
  MODEL_VIEW_TARGET_UNSPECIFIED = 0;
  // OpenShift AI's model deployments for the models namespace, at
  // https://rh-ai.<apps domain>/ai-hub/models/deployments/internal/<namespace>,
  // on clusters with role ingress or combined (the reference removes the
  // dashboard on inference clusters).
  MODEL_VIEW_TARGET_OPENSHIFT_AI = 1;
  // The LLMInferenceService in the OpenShift console: on clusters without
  // the OpenShift AI dashboard, and on an ingress or combined cluster whose
  // console host isn't console-openshift-console.<apps domain> and that has
  // no ai-grid/openshift-ai-url annotation.
  MODEL_VIEW_TARGET_OPENSHIFT_CONSOLE = 2;
}

// The model in MaaS on one ingress cluster. Output only.
message ModelIngressStatus {
  // ManagedCluster name.
  string cluster = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  // What the cluster reports.
  ModelMaasState state = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [6]
  }];

  // MaaS's or Argo CD's message, for example "Awaiting governance pairing".
  string message = 3;
}

// Derived model phase.
//
// In git mode, while no cluster has reported the model, the phase is
// UNSPECIFIED with reason SavedToGit. Once one has, the phase is, in this
// order of precedence:
//
//   - READY (reason Ready): every ingress cluster reports the model's
//     MaaSModelRef and ExternalModel ready, and every placed cluster is
//     READY in `clusters`.
//   - PARTIALLY_AVAILABLE (reason PartiallyAvailable): every ingress cluster
//     reports them ready, at least one placed cluster is READY and at least
//     one is not.
//   - FAILED (reason Failed): a cluster reports one of the model's objects
//     failed: Argo CD health Degraded, or its sync failed. An
//     LLMInferenceService KServe reports stopped is Degraded but not failed.
//   - PENDING (reason Stopped): every placed cluster reports it stopped
//     (`deployment` STOPPED) and has applied Git's change (`sync` SYNCED).
//   - PENDING (reason NotReady): otherwise, including while an ingress
//     cluster reports the MaaSModelRef not ready or hasn't reported it.
//
// A MaaSModelRef that waits only for a subscription (MaaS
// GovernanceAttached False, RuntimeReady True) counts as ready here: the
// model runs and is published, so it isn't PENDING. `maas` says
// AWAITING_SUBSCRIPTION, and `state` and `maas` keep the two sides apart for
// a list that shows both, such as "Ready" and "Awaiting subscription". KServe's and
// MaaS's Ready=False messages for steps still under way, such as a
// Deployment below its minimum availability, are pending, not failed.
//
// The ingress clusters are those with a catalog ingress Application and those
// labelled ai-grid/enabled "true" and ai-grid/role ingress or combined; each
// must report. READY and PARTIALLY_AVAILABLE need at least one: with none,
// nothing shows the model published, so it is PENDING, and the message ends
// "no ingress cluster has reported the MaaSModelRef".
//
// The order is the one the console's Models page uses (READY, PARTIALLY_AVAILABLE, FAILED, then the
// PENDING cases; proposal P13).
enum ModelPhase {
  MODEL_PHASE_UNSPECIFIED = 0;
  MODEL_PHASE_PENDING = 1;
  MODEL_PHASE_READY = 2;
  MODEL_PHASE_FAILED = 3;
  // Serving on some of the clusters its placement names but not all (see
  // above). Only a whole model has it; a cluster in ModelStatus.clusters is
  // READY, FAILED or PENDING.
  MODEL_PHASE_PARTIALLY_AVAILABLE = 4;
}

// The model on one placed cluster. In git mode it comes from the health the
// hub's catalog Argo CD Applications record for the cluster's
// LLMInferenceService and, on a combined cluster, which is also an ingress
// cluster, for its MaaSModelRef and ExternalModel. Output only.
message ModelClusterStatus {
  option (buf.validate.message).cel = {
    id: "model_cluster_status.view_link_paired"
    message: "view_url must be set exactly when view_target is specified"
    expression: "(this.view_url == '') == (this.view_target == 0)"
  };

  // ManagedCluster name, one of placement.selected_clusters.
  string cluster = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  // READY when every report from the cluster says ready; FAILED when one
  // says failed; PENDING when one says not ready or one is missing.
  // PARTIALLY_AVAILABLE is only a whole model's phase.
  ModelPhase phase = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      4
    ]
  }];

  // Ready, Failed, NotReady (a report says not ready), Stopped (the
  // LLMInferenceService is stopped, `deployment` STOPPED) or NoReport (the
  // cluster hasn't reported the object yet).
  string reason = 3 [(buf.validate.field).string.min_len = 1];

  // What the cluster reported, for example "LLMInferenceService not ready"
  // or "LLMInferenceService ready; no MaaSModelRef report; no ExternalModel
  // report".
  string message = 4;

  // What the cluster reports about the model's LLMInferenceService.
  ModelDeploymentState deployment = 5 [(buf.validate.field).enum.defined_only = true];

  // KServe's message about the deployment, for example "Deployment does
  // not have minimum availability.". Empty when it is running or hasn't
  // reported.
  string deployment_message = 6;

  // Whether Argo CD has applied the model's LLMInferenceService on the
  // cluster as Git has it.
  ModelSyncState sync = 7 [(buf.validate.field).enum.defined_only = true];

  // Argo CD's sync operation message while the sync failed or is being
  // retried, for example an AppProject refusing the kind.
  string sync_message = 8;

  // Git sync and deployment on this cluster in one word: the deployment's
  // state (READY, STARTING, FAILED, STOPPED) once the
  // LLMInferenceService is on the cluster; FAILED when its sync failed;
  // SYNCING while Argo CD hasn't applied it; SYNCED when it has but KServe
  // hasn't reported yet; UNSPECIFIED with no report.
  ModelState state = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [6]
  }];

  // Where to see the model on this cluster: OpenShift AI's model
  // deployments page, or the LLMInferenceService in the OpenShift console
  // (view_target). Built from the ManagedCluster's
  // consoleurl.cluster.open-cluster-management.io claim, the apps domain
  // after "console-openshift-console.", or from the cluster's
  // ai-grid/openshift-ai-url annotation when the dashboard's host differs.
  // Only an https URL with a host and no user info is used from the claim
  // or the annotation. Empty when there is neither (view_target
  // UNSPECIFIED).
  string view_url = 10 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {
      uri: true
      pattern: "^https://[^/?#@]+([/?#].*)?$"
    }
  }];

  // Whether view_url opens OpenShift AI or the OpenShift console.
  ModelViewTarget view_target = 11 [(buf.validate.field).enum.defined_only = true];
}

// Placement observed state.
message ModelPlacementStatus {
  // Number of clusters selected.
  int32 number_of_selected_clusters = 1;
  // Selected cluster names (ManagedCluster names): the values of the
  // placement's `name In [...]`, as ListPlacementClusters answers them.
  repeated string selected_clusters = 2;
  // Placement conditions when present.
  repeated Condition conditions = 3;
  // Unique sorted values of the `location` label of the selected clusters
  // (P8): where they are, not which clusters they are. Several clusters can
  // share one location, so these are not cluster names and a placement can't
  // name them; use selected_clusters for that. A selected cluster without a
  // location label adds nothing. Output only.
  repeated string locations = 4;
}

// ManifestWorkReplicaSet observed state.
message ModelRolloutStatus {
  // True when PlacementRolledOut is True.
  bool rolled_out = 1;
  // True when ManifestworkApplied is True.
  bool applied = 2;
  // Reason from the deciding condition.
  string reason = 3;
  // Per-cluster work summaries when available. Never set in git mode; see
  // ModelStatus.clusters.
  repeated ModelWorkStatus works = 4;
  // MWRS conditions.
  repeated Condition conditions = 5;
}

// One generated ManifestWork summary.
message ModelWorkStatus {
  string cluster = 1;
  string applied = 2;
  string available = 3;
  string progressing = 4;
  string degraded = 5;
}
