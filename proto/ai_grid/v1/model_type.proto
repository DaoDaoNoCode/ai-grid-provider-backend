syntax = "proto3";

package ai_grid.v1;

import "ai_grid/v1/condition_type.proto";
import "ai_grid/v1/metadata_type.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/v1;aigridv1";

// Model is a deployable LLM inference workload on the AI Grid.
//
// It maps to a hub LLMInferenceService (serving.kserve.io/v1alpha2) plus an
// optional ACM Placement and ManifestWorkReplicaSet that distribute the
// workload to managed clusters, and a MaaSModelRef for catalog registration.
//
// The `spec` contains the desired details and may be modified by the user.
// The `status` contains the current status and is provided by the system.
message Model {
  // Unique identifier. Equals metadata.name (DNS-1123 label).
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];

  Metadata metadata = 2;
  ModelSpec spec = 3;
  ModelStatus status = 4;
}

// Desired state of a Model (trimmed LLMInferenceService.spec + ACM placement).
message ModelSpec {
  // Where the artifact comes from and the name clients send.
  ModelSource model = 1;

  // Static replica count. Mutually exclusive with scaling.
  optional int32 replicas = 2;

  // LLMInferenceServiceConfig preset names merged under the spec.
  repeated string base_refs = 3;

  // Optional ServingRuntime / ClusterServingRuntime name.
  string runtime = 4;

  // Router / gateway configuration.
  ModelRouter router = 5;

  // Main container of the workload template.
  ModelContainer main = 6;

  // Autoscaling. Mutually exclusive with replicas.
  ModelScaling scaling = 7;

  // Where to deploy. Unset: hub-only LLMInferenceService.
  // Set: ACM Placement + ManifestWorkReplicaSet named model-<id>.
  ModelPlacement placement = 8;

  // ManifestWorkReplicaSet rollout. Only meaningful with placement; unset means All.
  ModelRollout rollout = 9;
}

// Model artifact source (spec.model).
message ModelSource {
  // Artifact URI (hf://, oci://, s3://, pvc://, http(s)://).
  string uri = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];

  // Identifier clients send in the request model field. Defaults to id:
  // Create writes the id when it is empty, and a stored model without one
  // reads as the id.
  string name = 2;
}

// Router configuration (spec.router).
message ModelRouter {
  // Gateway refs. Empty uses the product default
  // (openshift-ingress/openshift-ai-inference).
  repeated ModelGatewayRef gateway_refs = 1;

  // When true, controller manages the HTTPRoute (spec.router.route: {}).
  bool managed_route = 2;

  // When true, inference scheduler is created (spec.router.scheduler: {}).
  bool scheduler = 3;
}

// One gateway reference.
message ModelGatewayRef {
  string name = 1;
  string namespace = 2;
  string section_name = 3;
}

// Main container resources and environment.
message ModelContainer {
  // Runtime image. Empty uses the preset's.
  string image = 1;

  // Resource requests (cpu, memory, nvidia.com/gpu, ...).
  map<string, string> requests = 2;

  // Resource limits.
  map<string, string> limits = 3;

  // Environment variables (for example VLLM_ADDITIONAL_ARGS).
  repeated ModelEnvVar env = 4;
}

// One environment variable.
message ModelEnvVar {
  string name = 1;
  string value = 2;
}

// KEDA-based autoscaling.
message ModelScaling {
  // Minimum replicas (default 1 when unset / zero).
  int32 min_replicas = 1;

  // Maximum replicas (required when scaling is set).
  int32 max_replicas = 2;

  // Whether KEDA scaling is enabled. Must be true when scaling is set.
  bool keda = 3;

  // KEDA scale triggers (at least one required when keda is true).
  repeated ModelKedaTrigger triggers = 4;
}

// One KEDA scale trigger.
message ModelKedaTrigger {
  string type = 1;
  map<string, string> metadata = 2;
}

// ACM Placement desired state (subset used by the Models API).
message ModelPlacement {
  // Cluster sets to draw from. Empty means every bound set.
  repeated string cluster_sets = 1;

  // Label selector over ManagedCluster labels.
  ModelLabelSelector label_selector = 2;

  // Cap on selected clusters. Unset means all matching.
  optional int32 number_of_clusters = 3;

  // `spec.predicates[0].requiredClusterSelector.claimSelector.matchExpressions`:
  // requirements over the ManagedCluster's `status.clusterClaims` (for example
  // `platform.open-cluster-management.io`), AND-ed with `label_selector`. Same
  // operators as a label requirement.
  repeated ModelLabelSelectorRequirement claim_expressions = 4;

  // `spec.tolerations`. The hub taints a cluster that is unreachable or
  // unavailable with `NoSelect`; a Placement must tolerate the taint to keep
  // such a cluster selected.
  repeated ModelToleration tolerations = 5;
}

// One Placement toleration (`spec.tolerations[]`).
message ModelToleration {
  // Taint key, for example `cluster.open-cluster-management.io/unreachable`.
  // Empty matches every key and requires operator `Exists`.
  string key = 1;

  // `Equal` (the default when empty) or `Exists`, which takes no value.
  string operator = 2;

  // Taint value for `Equal`.
  string value = 3;

  // Taint effect to tolerate: `NoSelect`, `PreferNoSelect` or
  // `NoSelectIfNew`. Empty tolerates every effect.
  string effect = 4;

  // How long the taint is tolerated, counted from the taint's `timeAdded`.
  // Unset tolerates it forever.
  optional int64 toleration_seconds = 5;
}

// Label selector for Placement predicates.
message ModelLabelSelector {
  map<string, string> match_labels = 1;
  repeated ModelLabelSelectorRequirement match_expressions = 2;
}

// One label selector requirement.
message ModelLabelSelectorRequirement {
  string key = 1;
  // In, NotIn, Exists, or DoesNotExist.
  string operator = 2;
  repeated string values = 3;
}

// ManifestWorkReplicaSet rollout strategy.
message ModelRollout {
  ModelRolloutStrategy strategy = 1;
  // Progressive only: clusters at once (integer or percent like "20%").
  string max_concurrency = 2;
  // Failed/timed-out clusters tolerated (integer or percent).
  string max_failures = 3;
  // Progress deadline (e.g. "5m", "None").
  string progress_deadline = 4;
  // Hold succeeded slot before next (Progressive).
  string min_success_time = 5;
}

// Rollout strategy type.
enum ModelRolloutStrategy {
  MODEL_ROLLOUT_STRATEGY_UNSPECIFIED = 0;
  MODEL_ROLLOUT_STRATEGY_ALL = 1;
  MODEL_ROLLOUT_STRATEGY_PROGRESSIVE = 2;
  MODEL_ROLLOUT_STRATEGY_PROGRESSIVE_PER_GROUP = 3;
}

// Observed state of a Model.
message ModelStatus {
  // External URL when known.
  string url = 1;

  // LLMInferenceService conditions.
  repeated Condition conditions = 2;

  // Derived summary phase.
  ModelPhase phase = 3;

  // Reason of the condition that decided phase.
  string reason = 4;

  // Message of the condition that decided phase.
  string message = 5;

  // Placement status when placement is set.
  ModelPlacementStatus placement = 6;

  // ManifestWorkReplicaSet status when placement is set.
  ModelRolloutStatus rollout = 7;

  // Observed generation from the LLMInferenceService.
  int64 observed_generation = 8;
}

// Derived model phase. LLMInferenceService has no phase, so the server
// derives one; `status.reason` and `status.message` come from what decided it.
//
// Hub-only model (no ManifestWorkReplicaSet): from the LLMInferenceService
// `Ready` condition. True is READY; False with a reason that does not recover
// on its own (`ConfigNotFound`, `RefsInvalid`, `GatewaysNotReady`) is FAILED;
// any other False reason, Unknown or no condition is PENDING.
//
// Placed model (the ManifestWorkReplicaSet `model-<id>` exists): from the
// per-location works first, because the spoke agents write them and the
// ManifestWorkReplicaSet summary is computed from them later, so a summary can
// be stale while a work is not. With `total` the larger of the number of works
// and `status.placement.number_of_selected_clusters` (a selected cluster
// without a work yet is not serving), and `serving` the works whose phase is
// READY, the first rule that matches decides:
//
//   1. READY when `total` > 0 and every location is serving, or, when there
//      is no work to read, when the ManifestWorkReplicaSet's
//      `PlacementRolledOut` and `ManifestworkApplied` are both True; with the
//      reason and message of `PlacementRolledOut` when it is True, else none;
//   2. PARTIALLY_AVAILABLE when some but not all locations are serving, reason
//      `PartiallyAvailable`, message "<serving> of <total> clusters are
//      serving the model.";
//   3. FAILED when no location is serving and a work is FAILED, with that
//      work's reason and message (the first in cluster order);
//   4. PENDING otherwise, with the reason and message of `PlacementVerified`
//      when it is False, of `PlacementRolledOut` when `ManifestworkApplied` is
//      True (more clusters to come), else of `ManifestworkApplied`.
//
// So a ManifestWorkReplicaSet that still reports `PlacementRolledOut` and
// `ManifestworkApplied` True does not make a model READY while one of its
// works has failed.
enum ModelPhase {
  // No status yet.
  MODEL_PHASE_UNSPECIFIED = 0;
  // Starting, rolling out, or waiting for clusters.
  MODEL_PHASE_PENDING = 1;
  // Serving: on the hub, or on every selected location.
  MODEL_PHASE_READY = 2;
  // Not serving anywhere and failed: `Ready` False with a terminal reason
  // (hub), or a work that failed to apply or is degraded.
  MODEL_PHASE_FAILED = 3;
  // Placed model only: serving on some of its selected locations but not all.
  // Never set on a ModelWorkStatus.
  MODEL_PHASE_PARTIALLY_AVAILABLE = 4;
}

// Placement observed state.
message ModelPlacementStatus {
  // Number of clusters selected.
  int32 number_of_selected_clusters = 1;
  // Selected cluster names.
  repeated string selected_clusters = 2;
  // Placement conditions when present.
  repeated Condition conditions = 3;
  // Unique sorted `location` labels of decided clusters (P8). A decided
  // cluster without a location label adds nothing. Output only.
  repeated string locations = 4;
}

// ManifestWorkReplicaSet observed state.
message ModelRolloutStatus {
  // True when PlacementRolledOut is True.
  bool rolled_out = 1;
  // True when ManifestworkApplied is True.
  bool applied = 2;
  // Reason from the deciding condition.
  string reason = 3;
  // One entry per ManifestWork the ManifestWorkReplicaSet generated (one per
  // selected cluster that has a work yet), in cluster-name order.
  repeated ModelWorkStatus works = 4;
  // MWRS conditions.
  repeated Condition conditions = 5;
}

// The model on one selected location: the ManifestWork the
// ManifestWorkReplicaSet generated in that cluster's namespace on the hub, as
// the cluster's work agent last reported it. Output only.
message ModelWorkStatus {
  // Namespace of the ManifestWork: the cluster it targets.
  string cluster = 1;
  // Status of the work's `Applied` condition (`True`, `False`, `Unknown`),
  // empty when absent.
  string applied = 2;
  // Status of the work's `Available` condition, empty when absent.
  string available = 3;
  // Status of the work's `Progressing` condition, empty when absent.
  string progressing = 4;
  // Status of the work's `Degraded` condition, empty when absent.
  string degraded = 5;

  // The model's phase on this location, derived by the server. It reuses
  // ModelPhase rather than a per-work enum because it is the same summary of
  // the same model, read on one cluster, and the values mean the same thing
  // (PARTIALLY_AVAILABLE is never set here). The first rule that matches
  // decides:
  //
  //   1. READY when `ready` is true (the spoke reports the
  //      LLMInferenceService Ready), with no reason;
  //   2. FAILED when the work's `Applied` is False (the agent could not apply
  //      it, for example the spoke has no LLMInferenceService CRD), or its
  //      `Degraded` is True (the spoke's Ready is False with a terminal
  //      reason), with that condition's reason and message, Applied first;
  //   3. PENDING otherwise: with the reason and message of `Available` when it
  //      is present and not True, else of `Progressing` when present, else
  //      with none (the agent has not reported the work yet).
  ModelPhase phase = 6;

  // Reason of the condition that decided `phase`.
  string reason = 7;

  // Message of the condition that decided `phase`.
  string message = 8;

  // The ManifestWork's `status.conditions`: `Applied` and `Available` from the
  // work agent, `Progressing` and `Degraded` from the template's condition
  // rules (reason `ConditionRulesAggregated`).
  repeated Condition conditions = 9;

  // The spoke's LLMInferenceService `Ready` condition status, from the `ready`
  // status feedback value the template asks for
  // (`status.resourceStatus.manifests[].statusFeedback.values[]`). Unset until
  // the agent reports it, and when it reports neither True nor False.
  optional bool ready = 10;
}
