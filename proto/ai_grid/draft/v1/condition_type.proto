// DRAFT: the console's PROPOSAL for the APIs this backend doesn't implement yet. It is not
// this backend's API, which is ai_grid.v1 (proto/ai_grid/v1).
//
// Moved from the console repository (ai-grid-cloud/ai-grid-provider-console,
// mock/proto/ai_grid/v1 at ac80c25), with the package renamed to ai_grid.draft.v1. It began
// as a superset of the first backend's three RPCs plus the shapes drafted in
// docs/draft/research/backend-conventions.md section 6. Only the draft fake
// (internal/fakeinfra/draft, started by make dev-fake) serves it, over gRPC, for the
// console's BFF. Nothing here checks it against ai_grid.v1: the console's drift test
// stayed in the console.
//
// When this backend implements an area, that area's RPCs and fake code are deleted here
// and the console moves to ai_grid.v1 (docs/draft/README.md).

syntax = "proto3";

package ai_grid.draft.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/draft/v1;aigriddraftv1";

// Status of a condition. Kubernetes `Unknown` is reported as UNSPECIFIED.
enum ConditionStatus {
  // The system cannot decide whether the object is in the condition.
  CONDITION_STATUS_UNSPECIFIED = 0;
  // The object is in the condition.
  CONDITION_STATUS_TRUE = 1;
  // The object is not in the condition.
  CONDITION_STATUS_FALSE = 2;
}

// One entry of a Kubernetes-style `status.conditions` list.
message Condition {
  // Condition type as defined by the owning controller, for example
  // `ManagedClusterConditionAvailable`, `HubAcceptedManagedCluster`,
  // `ManagedClusterJoined`. Types are open-ended; clients must ignore unknown ones.
  string type = 1;
  // Whether the object is in the condition.
  ConditionStatus status = 2;
  // Last time the condition changed from one status to another.
  google.protobuf.Timestamp last_transition_time = 3;
  // Machine-readable reason in CamelCase, when the controller provides one.
  optional string reason = 4;
  // Human-readable detail, intended for people debugging the object.
  optional string message = 5;
  // Generation of the object the condition was computed for; zero when unknown.
  int64 observed_generation = 6;
}
