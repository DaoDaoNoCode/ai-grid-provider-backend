syntax = "proto3";

package ai_grid.draft.v1;

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/draft/v1;aigriddraftv1";

// Catalog entries offered to tenants: ConfigMaps on the hub. OSAC-style plural of CatalogItem.
service CatalogItems {
  // Lists CatalogItems.
  rpc ListCatalogItems(ListCatalogItemsRequest) returns (ListCatalogItemsResponse);
  // Returns one CatalogItem.
  rpc GetCatalogItem(GetCatalogItemRequest) returns (GetCatalogItemResponse);
  // Creates a CatalogItem.
  rpc CreateCatalogItem(CreateCatalogItemRequest) returns (CreateCatalogItemResponse);
  // Updates a CatalogItem.
  rpc UpdateCatalogItem(UpdateCatalogItemRequest) returns (UpdateCatalogItemResponse);
  // Deletes a CatalogItem.
  rpc DeleteCatalogItem(DeleteCatalogItemRequest) returns (DeleteCatalogItemResponse);
}

// Request of ListCatalogItems. Fields to be agreed.
message ListCatalogItemsRequest {}

// Response of ListCatalogItems. Fields to be agreed.
message ListCatalogItemsResponse {}

// Request of GetCatalogItem. Fields to be agreed.
message GetCatalogItemRequest {}

// Response of GetCatalogItem. Fields to be agreed.
message GetCatalogItemResponse {}

// Request of CreateCatalogItem. Fields to be agreed.
message CreateCatalogItemRequest {}

// Response of CreateCatalogItem. Fields to be agreed.
message CreateCatalogItemResponse {}

// Request of UpdateCatalogItem. Fields to be agreed.
message UpdateCatalogItemRequest {}

// Response of UpdateCatalogItem. Fields to be agreed.
message UpdateCatalogItemResponse {}

// Request of DeleteCatalogItem. Fields to be agreed.
message DeleteCatalogItemRequest {}

// Response of DeleteCatalogItem. Fields to be agreed.
message DeleteCatalogItemResponse {}
