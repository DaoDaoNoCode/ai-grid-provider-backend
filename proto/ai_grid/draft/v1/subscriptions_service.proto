// DRAFT: the console's PROPOSAL to ai-grid-backend, not the backend's shipped API.
//
// The backend's real proto (vendored unchanged in mock/proto/upstream/ai_grid.proto)
// has three RPCs. This draft keeps those services, messages, field names, numbers and
// types byte-for-byte compatible and adds the shapes drafted in
// mock/research/backend-conventions.md section 6, so the console's fake backend, BFF
// and UI can be built against them. bff/internal/protodrift proves the draft stays a
// strict superset of the vendored upstream file.
//
// When the backend ships these RPCs the console switches its import back to the
// backend's generated package and deletes this draft.

syntax = "proto3";

package ai_grid.draft.v1;

import "ai_grid/draft/v1/model_type.proto";
import "ai_grid/draft/v1/subscription_type.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/draft/v1;aigriddraftv1";

// MaaS subscriptions and the authorization policies paired with them.
service Subscriptions {
  // Lists every subscription.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  // The subscription, the models it references, the auth policies that cover them
  // and the models' MaaS registrations.
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  // With create_auth_policy, also creates <name>-policy for the same groups and models.
  // AlreadyExists when the name is taken, or an authorization policy this service didn't
  // create already has the policy's name.
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  // Replaces the editable fields and applies the groups and models to <name>-policy when
  // this service created it; never touches other authorization policies. With lock,
  // Aborted unless object.resource_version is the current one.
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  // Also deletes <name>-policy when this service created it. FailedPrecondition while the
  // subscription is being deleted.
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
}

message ListSubscriptionsRequest {}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
}

message GetSubscriptionRequest {
  string name = 1;
}

message GetSubscriptionResponse {
  Subscription subscription = 1;
  repeated Model model_refs = 2;
  repeated AuthPolicy auth_policies = 3;
  // Proposal for the ai-grid-backend owners; implemented in the fake (P12,
  // field 4). The MaaSModelRef status of each referenced model that exists.
  repeated ModelRegistration model_registrations = 4;
}

message CreateSubscriptionRequest {
  Subscription object = 1;
  bool create_auth_policy = 2;
}

message CreateSubscriptionResponse {
  Subscription subscription = 1;
  // Set when create_auth_policy was.
  AuthPolicy auth_policy = 2;
}

message UpdateSubscriptionRequest {
  Subscription object = 1;
  bool lock = 2;
}

message UpdateSubscriptionResponse {
  Subscription subscription = 1;
}

message DeleteSubscriptionRequest {
  string name = 1;
  // When set, Aborted unless it matches the current version.
  string resource_version = 2;
}

message DeleteSubscriptionResponse {}
