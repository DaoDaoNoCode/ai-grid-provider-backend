// DRAFT: the console's PROPOSAL for the APIs this backend doesn't implement yet. It is not
// this backend's API, which is ai_grid.v1 (proto/ai_grid/v1).
//
// Moved from the console repository (ai-grid-cloud/ai-grid-provider-console,
// mock/proto/ai_grid/v1 at ac80c25), with the package renamed to ai_grid.draft.v1. It began
// as a superset of the first backend's three RPCs plus the shapes drafted in
// docs/draft/research/backend-conventions.md section 6. Only the draft fake
// (internal/fakeinfra/draft, started by make dev-fake) serves it, over gRPC, for the
// console's BFF. Nothing here checks it against ai_grid.v1: the console's drift test
// stayed in the console.
//
// When this backend implements an area, that area's RPCs and fake code are deleted here
// and the console moves to ai_grid.v1 (docs/draft/README.md).

syntax = "proto3";

package ai_grid.draft.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/osac-project/ai-grid-provider-backend/gen/ai_grid/draft/v1;aigriddraftv1";

// Metadata of an object stored in the hub. Mirrors the subset of Kubernetes
// ObjectMeta that the console needs; the backend never exposes raw manifests.
// Used by new Kubernetes-backed objects; `ManagedCluster` keeps its flat fields.
message ObjectMeta {
  // Namespace of the object. Empty for cluster-scoped kinds.
  string namespace = 1;
  // Server-assigned unique identifier (Kubernetes UID). Output only.
  string uid = 2;
  // Opaque version used for optimistic concurrency (`lock` on Update). Output only.
  string resource_version = 3;
  // Generation of the desired state. Output only.
  int64 generation = 4;
  // Time the object was created. Output only.
  google.protobuf.Timestamp creation_timestamp = 5;
  // Time deletion was requested; unset while the object is live. Output only.
  google.protobuf.Timestamp deletion_timestamp = 6;
  // Kubernetes labels. Keys follow the Kubernetes label-key rules.
  map<string, string> labels = 7;
  // Kubernetes annotations. Opaque to the backend.
  map<string, string> annotations = 8;
  // Finalizers still blocking deletion. Output only.
  repeated string finalizers = 9;
}
