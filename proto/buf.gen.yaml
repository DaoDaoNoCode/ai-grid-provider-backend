version: v2

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.5
    out: ../gen
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: ../gen
    opt:
      - paths=source_relative

  - remote: buf.build/connectrpc/go:v2.0.1
    out: ../gen
    opt:
      - paths=source_relative

  # No gateway plugin: vanguard serves the google.api.http annotations at
  # runtime. openapiv2 still reads them, so docs/openapi is unaffected.
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.26.1
    out: ../docs/openapi
    opt:
      - allow_merge=true
      - merge_file_name=ai_grid
      - json_names_for_fields=false
