apiVersion: v1
kind: Namespace
metadata:
  name: ai-grid
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-grid-provider-backend
  namespace: ai-grid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-provider-backend-managedclusters
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-backend-managedclusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-provider-backend-managedclusters
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-backend
    namespace: ai-grid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-grid-provider-backend
  namespace: ai-grid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-grid-provider-backend
  template:
    metadata:
      labels:
        app: ai-grid-provider-backend
    spec:
      serviceAccountName: ai-grid-provider-backend
      containers:
        - name: ai-grid-provider-backend
          image: localhost/ai-grid-provider-backend:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak.ai-grid.svc:8080
            - name: KEYCLOAK_ADMIN_REALM
              value: master
            - name: KEYCLOAK_REALM
              value: ai-grid
            - name: KEYCLOAK_ADMIN_USERNAME
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
          ports:
            - name: grpc
              containerPort: 8080
            - name: http
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-grid-provider-backend
  namespace: ai-grid
spec:
  selector:
    app: ai-grid-provider-backend
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
    - name: http
      port: 8081
      targetPort: http
