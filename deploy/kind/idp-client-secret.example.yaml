# Example IdP client Secret for Kind E2E. Copy/apply before CreateTenant with
# spec.identity_provider.config.client_secret_secret_name = demo-idp-secret.
#
#   kubectl apply -f deploy/kind/idp-client-secret.example.yaml
#
# Do not put real broker secrets in the backend namespace (ai-grid).
apiVersion: v1
kind: Secret
metadata:
  name: demo-idp-secret
  namespace: ai-grid-idp-secrets
type: Opaque
stringData:
  client-secret: "demo-broker-client-secret"
