apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
  namespace: ai-grid
type: Opaque
stringData:
  username: keycloak
  password: keycloak
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
  namespace: ai-grid
spec:
  selector:
    app: keycloak-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-db
  namespace: ai-grid
spec:
  selector:
    matchLabels:
      app: keycloak-db
  template:
    metadata:
      labels:
        app: keycloak-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: password}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ai-grid
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ai-grid
spec:
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          # Match hub / Option 2 docs (26.8): org IdP link PUT with
          # autoMembership/membershipType is not on 26.3 (HTTP 405).
          image: quay.io/keycloak/keycloak:26.8.0
          args: ["start-dev", "--http-port=8080"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: username}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: password}
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-init
  namespace: ai-grid
data:
  init.sh: |
    #!/bin/sh
    set -eu
    base=http://keycloak:8080
    until curl -fsS "$base/realms/master/.well-known/openid-configuration" >/dev/null; do
      sleep 2
    done
    token=$(curl -fsS -X POST "$base/realms/master/protocol/openid-connect/token" \
      -H 'Content-Type: application/x-www-form-urlencoded' \
      --data-urlencode grant_type=password --data-urlencode client_id=admin-cli \
      --data-urlencode username=admin --data-urlencode password=admin | \
      sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
    auth="Authorization: Bearer $token"
    curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/admin/realms" \
      -H "$auth" -H 'Content-Type: application/json' \
      --data '{"realm":"ai-grid","enabled":true}' | grep -E '^(201|409)$' >/dev/null
    curl -sS -o /dev/null -w '%{http_code}' -X PUT "$base/admin/realms/ai-grid" \
      -H "$auth" -H 'Content-Type: application/json' \
      --data '{"realm":"ai-grid","enabled":true,"organizationsEnabled":true}' | grep '^204$' >/dev/null
    for tenant in tenant-a tenant-b; do
      curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/admin/realms/ai-grid/organizations" \
        -H "$auth" -H 'Content-Type: application/json' \
        --data "{\"name\":\"$tenant\",\"alias\":\"$tenant\",\"domains\":[{\"name\":\"$tenant.example.com\",\"verified\":false}]}" | \
        grep -E '^(201|409)$' >/dev/null
    done
    # Client that emits flat claim org_id from user attribute maas_org_id
    # (companion to the provider-backend IdP hardcoded-attribute mapper).
    curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/admin/realms/ai-grid/clients" \
      -H "$auth" -H 'Content-Type: application/json' \
      --data '{"clientId":"saas","name":"saas","enabled":true,"publicClient":true,"directAccessGrantsEnabled":true,"standardFlowEnabled":true,"protocol":"openid-connect"}' | \
      grep -E '^(201|409)$' >/dev/null
    client_uuid=$(curl -fsS "$base/admin/realms/ai-grid/clients?clientId=saas" -H "$auth" | \
      sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -n1)
    if [ -n "$client_uuid" ]; then
      curl -sS -o /dev/null -w '%{http_code}' -X POST \
        "$base/admin/realms/ai-grid/clients/$client_uuid/protocol-mappers/models" \
        -H "$auth" -H 'Content-Type: application/json' \
        --data '{"name":"MaaS org id","protocol":"openid-connect","protocolMapper":"oidc-usermodel-attribute-mapper","config":{"user.attribute":"maas_org_id","claim.name":"org_id","jsonType.label":"String","multivalued":"false","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}' | \
        grep -E '^(201|409)$' >/dev/null || true
    fi
    # Second realm used as a stand-in OIDC broker for IdP create E2E (URLs only;
    # full broker login is optional).
    curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/admin/realms" \
      -H "$auth" -H 'Content-Type: application/json' \
      --data '{"realm":"org-idp","enabled":true}' | grep -E '^(201|409)$' >/dev/null
    curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/admin/realms/org-idp/clients" \
      -H "$auth" -H 'Content-Type: application/json' \
      --data '{"clientId":"ai-grid-broker","secret":"demo-broker-client-secret","enabled":true,"publicClient":false,"directAccessGrantsEnabled":true,"standardFlowEnabled":true,"redirectUris":["*"],"protocol":"openid-connect"}' | \
      grep -E '^(201|409)$' >/dev/null
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-init
  namespace: ai-grid
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/opt/init/init.sh"]
          volumeMounts:
            - name: init
              mountPath: /opt/init
      volumes:
        - name: init
          configMap:
            name: keycloak-init
            defaultMode: 0755
