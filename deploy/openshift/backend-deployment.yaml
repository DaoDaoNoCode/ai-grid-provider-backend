apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-grid-provider-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-grid-provider-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-grid-provider-backend
    spec:
      serviceAccountName: ai-grid-provider-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-grid-provider-backend
          image: ai-grid-provider-backend
          imagePullPolicy: Always
          env:
            # Populated by hack/openshift-up.sh. The pod will not start without
            # this secret, so the binary never falls back to built-in admin/admin.
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-backend-keycloak
                  key: url
            - name: KEYCLOAK_ADMIN_REALM
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-backend-keycloak
                  key: admin-realm
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-backend-keycloak
                  key: realm
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-backend-keycloak
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-backend-keycloak
                  key: password
          ports:
            - name: grpc
              containerPort: 8080
            - name: http
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
