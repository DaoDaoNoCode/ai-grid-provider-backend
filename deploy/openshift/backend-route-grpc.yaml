# Passthrough Route for native gRPC. The backend serves plaintext gRPC today,
# so most local clients should prefer `oc port-forward` for grpcurl -plaintext.
# Keep this Route for clusters that terminate TLS elsewhere or upgrade later.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-grid-provider-backend-grpc
spec:
  to:
    kind: Service
    name: ai-grid-provider-backend
  port:
    targetPort: grpc
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
