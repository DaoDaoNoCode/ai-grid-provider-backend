apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-provider-backend-managedclusters
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # OCM admission requires managedclustersets/join to place a ManagedCluster in a
  # ManagedClusterSet (unlabeled CRs join "default"). Without this, Create fails with:
  #   cannot add/remove the resource to/from ManagedClusterSet "default"
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclustersets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclustersets/join"]
    verbs: ["create"]
  # Setting/updating spec.hubAcceptsClient requires the accept subresource.
  - apiGroups: ["register.open-cluster-management.io"]
    resources: ["managedclusters/accept"]
    verbs: ["update"]
  # Clusters List/Get read each cluster's provisioning from the root
  # ai-grid-ready Policy's status (AI_GRID_READY_POLICY, default
  # ai-grid-policies/ai-grid-ready). get on that one name only: other
  # Policies, and the per-cluster copies (named ai-grid-policies.ai-grid-ready)
  # where ACM renders hub templates such as fromSecret, stay unreadable. A
  # Role in ai-grid-policies would be narrower, but this kustomization's
  # namespace: ai-grid would move it. Change the name here if you change
  # AI_GRID_READY_POLICY.
  - apiGroups: ["policy.open-cluster-management.io"]
    resources: ["policies"]
    resourceNames: ["ai-grid-ready"]
    verbs: ["get"]
  # Subscriptions CRUD (+ managed AuthPolicy) and Models Delete guards against MaaS CRs.
  # Objects live in AI_GRID_SUBSCRIPTION_NAMESPACE (default models-as-a-service).
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["maassubscriptions", "maasauthpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Get/List enrich model_refs and return model_registrations from MaaSModelRef.
  # Models Create/Update/Delete also write MaaSModelRef in AI_GRID_MODELS_NAMESPACE.
  # Subscriptions Get/List enrich model_refs and return model_registrations (read).
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["maasmodelrefs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Models CRUD: LLMInferenceService (+ optional Placement / ManifestWorkReplicaSet).
  # Objects live in AI_GRID_MODELS_NAMESPACE (default ai-grid-internal-models).
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["placements", "placementdecisions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["work.open-cluster-management.io"]
    resources: ["manifestworkreplicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-backend-managedclusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-provider-backend-managedclusters
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-backend
    namespace: ai-grid
