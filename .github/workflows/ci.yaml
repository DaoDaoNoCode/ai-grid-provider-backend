# CI: lint + unit tests (+ generated-file check). On pushes to main/development,
# also build and push the container image to Quay.
#
# pull_request: check job only (never publishes images).
# push to main/development: check, then image.
#
# Required repository secrets for the image job:
#   QUAY_USERNAME  Quay.io robot or user
#   QUAY_PASSWORD  Quay.io robot token / password
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod
  IMAGE: quay.io/rh-ee-rjjohnso/ai-grid-provider-backend
  PLATFORM: linux/amd64
  # Pin for reproducible CI. Need >= v2.9.0 so the binary is built with Go >= 1.26
  # (go.mod is go 1.26.3). golangci-lint rejects modules newer than its build Go.
  GOLANGCI_LINT_VERSION: v2.12.2
  BUF_VERSION: "1.50.0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Build binary
        run: make build

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Compile with the Go from setup-go so the linter matches go.mod (1.26.x).
          install-mode: goinstall

      - name: Unit tests
        run: make unit

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: Verify generated files are up to date
        run: |
          make generate
          git add -N gen docs/openapi internal/restgateway/openapi || true
          if ! git diff --exit-code -- gen docs/openapi/ai_grid.swagger.json internal/restgateway/openapi/ai_grid.swagger.json; then
            echo "::error::Generated files are out of date. Run 'make generate' and commit the results."
            exit 1
          fi

  image:
    name: Build and push image
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          platforms: ${{ env.PLATFORM }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
