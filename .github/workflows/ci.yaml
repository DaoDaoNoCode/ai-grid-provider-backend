# CI: lint + unit tests (+ generated-file check). Pushes to main, v* tags and
# manual runs then publish the container image to ghcr.io.
#
# pull_request: check job only (never publishes images).
# push to main / v* tag / workflow_dispatch: check, then publish.
#
# No stored secrets: GITHUB_TOKEN pushes to ghcr.io with packages:write.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod
  IMAGE: ghcr.io/ai-grid-cloud/ai-grid-provider-backend
  PLATFORM: linux/amd64
  # Pin for reproducible CI. Need >= v2.9.0 so the binary is built with Go >= 1.26
  # (go.mod is go 1.26.3). golangci-lint rejects modules newer than its build Go.
  GOLANGCI_LINT_VERSION: v2.12.2
  BUF_VERSION: "1.50.0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Build binary
        run: make build

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Compile with the Go from setup-go so the linter matches go.mod (1.26.x).
          install-mode: goinstall

      - name: Unit tests
        run: make unit

      - name: PR-image delete logic
        run: hack/test-image-workflows.sh

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: Verify generated files are up to date
        run: |
          make generate
          git add -N gen docs/openapi internal/restgateway/openapi || true
          if ! git diff --exit-code -- gen docs/openapi/ai_grid.swagger.json internal/restgateway/openapi/ai_grid.swagger.json; then
            echo "::error::Generated files are out of date. Run 'make generate' and commit the results."
            exit 1
          fi

  # Last job: needs the checks, so a merge whose checks failed never ships.
  # sha-<full sha> is the tag to deploy; latest tracks main; semver comes
  # from v* tags.
  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Only the default-branch rule above sets latest; the default
          # latest=auto would also move it on every v* tag.
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          push: true
          platforms: ${{ env.PLATFORM }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
          cache-from: type=gha,scope=ai-grid-provider-backend
          cache-to: type=gha,mode=max,scope=ai-grid-provider-backend,ignore-error=true
          # A plain manifest, not an index with an attestation child: ghcr
          # lists that child as an untagged version.
          provenance: false
