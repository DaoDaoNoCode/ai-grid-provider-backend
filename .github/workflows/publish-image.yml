name: publish-image

# PR preview images are disabled. Container images build and publish only from
# ci.yaml after Check passes on push/merge to main, on v* tags, and on
# workflow_dispatch (Docker Buildx + digest-pinned actions). Local builds stay
# Podman-first via `make image`.
#
# This workflow used to build an uncredentialed OCI archive on pull_request for
# publish-pr-image.yml. Kept as a no-op stub so the workflow name remains
# reserved and historical docs/links do not 404; do not re-enable pull_request
# image builds without an explicit maintainer decision.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: PR image builds are disabled
        run: |
          echo "PR image builds are disabled. Images publish from ci.yaml on merge to main (and v* tags)."
          exit 0
