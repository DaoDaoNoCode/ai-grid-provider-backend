name: publish-pr-image

# PR preview image push is disabled. Images publish only from ci.yaml on
# push/merge to main (and intentional v* tags / workflow_dispatch), never on
# pull_request. Local builds remain Podman-first (`make image`).
#
# The push script below is retained (job gated off) so hack/test-image-workflows.sh
# can still exercise superseded-digest delete logic against the same package
# name CI uses. Do not re-enable without an explicit maintainer decision.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-image-disabled
  cancel-in-progress: false

env:
  # The only image this workflow would push. Keep in step with ci.yaml.
  ALLOWED_IMAGES: ai-grid-provider-backend

jobs:
  push:
    # Hard-disabled: PR image publish must not run.
    if: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
      packages: write
    steps:
      - name: Find the open PR for this head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number=$(gh api --method GET "repos/${REPO}/pulls" \
            -f head="${HEAD_OWNER}:${HEAD_BRANCH}" -f state=open \
            --jq "[.[] | select(.head.sha == \"${HEAD_SHA}\")][0].number // empty")
          if [ -z "$number" ]; then
            echo "No open PR from ${HEAD_OWNER}:${HEAD_BRANCH} has ${HEAD_SHA} as its head; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Download image artifacts
        if: steps.pr.outputs.skip != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pr-image-*
          path: /tmp/pr-images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Digests that a tagged index lists as children: the platform and
          # attestation manifests of a multi-arch or attested release. ghcr
          # shows them untagged, and a PR can push identical bytes and get them
          # tagged pr-<number>, so they are never deleted. Reads the image's
          # versions on stdin. A failed lookup fails the job instead of
          # deleting with a partial list.
          protected_digests() {
            jq -r '.[] | select(.metadata.container.tags | length > 0) | .name' \
              | while read -r digest; do
                  skopeo inspect --raw "docker://ghcr.io/${OWNER}/$1@${digest}" \
                    | jq -r '.manifests[]?.digest // empty' || exit 1
                done | sort -u
          }

          shopt -s nullglob
          dirs=(/tmp/pr-images/pr-image-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No image artifacts on run ${RUN_ID}; skipping."
            exit 0
          fi
          echo "$GH_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          for dir in "${dirs[@]}"; do
            image=$(basename "$dir")
            image=${image#pr-image-}
            case " $ALLOWED_IMAGES " in
              *" $image "*) ;;
              *)
                echo "::warning::ignoring artifact for unexpected image '$image'"
                continue
                ;;
            esac
            dest="ghcr.io/${OWNER}/${image}:pr-${PR_NUMBER}"

            # What pr-<number> pointed at, so the superseded digest can be
            # deleted once the tag moves; empty on the PR's first push.
            old_digest=$(skopeo inspect --format '{{.Digest}}' --no-tags "docker://${dest}" 2>/dev/null || true)

            skopeo copy "oci-archive:${dir}${image}.tar" "docker://${dest}"

            new_digest=$(skopeo inspect --format '{{.Digest}}' --no-tags "docker://${dest}")
            if [ -n "$old_digest" ] && [ "$old_digest" != "$new_digest" ]; then
              versions=$(gh api "orgs/${OWNER}/packages/container/${image}/versions" --paginate)
              protected=$(protected_digests "$image" <<< "$versions")
              if grep -Fxq -- "$old_digest" <<< "$protected"; then
                echo "::warning::keeping ${image}@${old_digest}: a tagged index lists it"
                continue
              fi
              # Delete exactly the version the tag moved off, and only if
              # nothing else still tags it.
              id=$(jq -r --arg digest "$old_digest" \
                '.[] | select(.name == $digest and (.metadata.container.tags | length == 0)) | .id' <<< "$versions")
              if [ -n "$id" ]; then
                echo "Deleting superseded ${image}@${old_digest} (version ${id})"
                gh api --method DELETE "orgs/${OWNER}/packages/container/${image}/versions/${id}"
              fi
            fi
          done
